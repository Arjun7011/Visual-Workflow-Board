<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisualWork Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
    <h1>📋 Visual-Workflow-Board </h1>
    <button id="themeToggle">🌙 Dark Mode</button>
</div>

    <div class="task-input">
        <input type="text" id="taskInput" placeholder="Enter Task">
        <button onclick="addTask()">Add Task</button>
    </div>

    <div class="board">

        <div class="column" data-status="todo">
            <h2>TODO</h2>
            <div class="task-list" id="todo"></div>
        </div>

        <div class="column" data-status="progress">
            <h2>IN PROGRESS</h2>
            <div class="task-list" id="progress"></div>
        </div>

        <div class="column" data-status="done">
            <h2>DONE</h2>
            <div class="task-list" id="done"></div>
        </div>

        <div class="column" data-status="approved">
            <h2>APPROVED</h2>
            <div class="task-list" id="approved"></div>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
